openapi: 3.0.1
info:
  title: Flight Control Keylime Verifier API
  version: v1beta1
  description: |
    Keylime Verifier API client for Flight Control.
    This API wraps communication with the Keylime verifier service for TPM attestation verification.
  contact:
    name: The Flight Control Team
    url: https://flightctl.io
    email: team@flightctl.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /
tags:
  - name: attestation
    description: Operations for TPM attestation verification via Keylime.
paths:
  /v2.5/verify/evidence:
    post:
      tags:
        - attestation
      description: Verify TPM attestation evidence (one-shot verification, v2.5 API)
      operationId: verifyEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEvidenceRequest'
      responses:
        "200":
          description: Evidence verification completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEvidenceResponse'
        "400":
          description: Bad Request - Invalid evidence data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2.1/agents/{agent_id}:
    post:
      tags:
        - attestation
      description: Verify TPM attestation data with the Keylime verifier (blocking call)
      operationId: verifyAttestation
      parameters:
        - name: agent_id
          in: path
          required: true
          description: Unique identifier for the device being attested
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestationVerificationRequest'
      responses:
        "200":
          description: Attestation verification completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationVerificationResponse'
        "400":
          description: Bad Request - Invalid attestation data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    VerifyEvidenceRequest:
      type: object
      description: Request to verify TPM evidence using v2.5 one-shot verification API (latest master branch format with nested data)
      properties:
        type:
          type: string
          description: Evidence type (always "tpm" for TPM attestation)
          default: "tpm"
        data:
          type: object
          description: Nested object containing all attestation data parameters
          properties:
            quote:
              type: string
              description: Base64-encoded TPM quote data
            nonce:
              type: string
              description: Base64-encoded challenge nonce
            hash_alg:
              type: string
              description: Hash algorithm used
              default: "sha256"
            tpm_ek:
              type: string
              description: Base64-encoded Endorsement Key
            tpm_ak:
              type: string
              description: Base64-encoded Attestation Key
            tpm_policy:
              type: string
              description: TPM policy (JSON object as string)
            runtime_policy:
              type: string
              description: IMA runtime policy (JSON object as string)
            mb_policy:
              type: string
              description: Measured boot policy (JSON string)
            ima_measurement_list:
              type: string
              description: IMA measurement log
            mb_log:
              type: string
              description: Measured boot log
          required:
            - quote
            - nonce
            - hash_alg
            - tpm_ak
      required:
        - type
        - data
    VerifyEvidenceResponse:
      type: object
      description: Response from v2.5 one-shot evidence verification (latest master branch format)
      properties:
        code:
          type: integer
          description: HTTP status code
        status:
          type: string
          description: Status message
        results:
          type: object
          description: Verification results
          properties:
            valid:
              type: boolean
              description: Whether the evidence passed verification (true=valid, false=invalid)
            claims:
              type: object
              description: Claims extracted from the evidence
              additionalProperties: true
            failures:
              type: array
              description: List of validation failures (if any)
              items:
                type: object
                additionalProperties: true
      required:
        - code
        - status
        - results
    AttestationVerificationRequest:
      type: object
      description: Request to verify TPM attestation data with the Keylime verifier
      properties:
        aik_tpm:
          type: string
          description: Base64-encoded AIK public key from TPM
        ek_tpm:
          type: string
          description: Base64-encoded EK public key from TPM
        ekcert:
          type: string
          description: Base64-encoded EK certificate
        mtls_cert:
          type: string
          description: mTLS certificate for secure communication (optional)
        quote:
          type: string
          description: Base64-encoded TPM quote data
        hash_alg:
          type: string
          description: Hash algorithm used (e.g., "sha256", "sha384")
          default: "sha256"
        enc_alg:
          type: string
          description: Encryption algorithm used (e.g., "rsa", "ecc")
          default: "rsa"
        sign_alg:
          type: string
          description: Signature algorithm used (e.g., "rsassa", "rsapss")
          default: "rsassa"
        mb_policy:
          type: string
          description: JSON-formatted measured boot policy
        runtime_policy:
          type: string
          description: JSON-formatted IMA runtime policy
        tpm_policy:
          type: string
          description: JSON-formatted TPM PCR policy
        cloudagent_ip:
          type: string
          description: IP address or hostname of the agent (required by Keylime)
        cloudagent_port:
          type: integer
          description: Port number of the agent (required by Keylime)
          default: 9002
        supported_version:
          type: string
          description: Supported Keylime protocol version
          default: "2.1"
        metadata:
          type: string
          description: Metadata about the agent as JSON string (required by Keylime)
          default: "{}"
        ima_sign_verification_keys:
          type: string
          description: IMA signature verification keys (required by Keylime)
          default: ""
        revocation_key:
          type: string
          description: Revocation key for the agent (required by Keylime)
          default: ""
        accept_tpm_hash_algs:
          type: array
          description: List of accepted TPM hash algorithms (required by Keylime)
          items:
            type: string
          default: ["sha256"]
        accept_tpm_encryption_algs:
          type: array
          description: List of accepted TPM encryption algorithms (required by Keylime)
          items:
            type: string
          default: ["rsa", "ecc"]
        accept_tpm_signing_algs:
          type: array
          description: List of accepted TPM signing algorithms (required by Keylime)
          items:
            type: string
          default: ["rsassa", "rsapss", "ecdsa"]
      required:
        - aik_tpm
        - cloudagent_ip
        - cloudagent_port
        - metadata
        - ima_sign_verification_keys
        - revocation_key
        - accept_tpm_hash_algs
        - accept_tpm_encryption_algs
        - accept_tpm_signing_algs
    AttestationVerificationResponse:
      type: object
      description: Response from Keylime attestation verification
      properties:
        results:
          type: object
          description: Verification result details object
          additionalProperties: true
      required:
        - results
    ErrorResponse:
      type: object
      description: Error response from Keylime verifier
      properties:
        code:
          type: integer
          description: HTTP status code
        status:
          type: string
          description: Error status message
        results:
          type: object
          description: Additional error details
